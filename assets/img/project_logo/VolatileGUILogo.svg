<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b24"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="ram" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3a7"/>
      <stop offset="1" stop-color="#3ea6ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="75%">
      <stop offset="0" stop-color="#3ea6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3ea6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#glow)"/>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="none" stroke="#3ea6ff" stroke-opacity="0.25" stroke-width="2"/>

  <!-- RAM stick -->
  <g transform="translate(128,170) rotate(-8)">
    <rect x="-78" y="-24" width="156" height="48" rx="8" fill="url(#ram)"/>
    <g fill="#0c0f14" fill-opacity="0.9">
      <rect x="-70" y="20" width="10" height="14" rx="2"/>
      <rect x="-52" y="20" width="10" height="14" rx="2"/>
      <rect x="-34" y="20" width="10" height="14" rx="2"/>
      <rect x="-16" y="20" width="10" height="14" rx="2"/>
      <rect x="2"   y="20" width="10" height="14" rx="2"/>
      <rect x="20"  y="20" width="10" height="14" rx="2"/>
      <rect x="38"  y="20" width="10" height="14" rx="2"/>
      <rect x="56"  y="20" width="10" height="14" rx="2"/>
    </g>
    <rect x="-40" y="-14" width="34" height="28" rx="3" fill="#0c0f14" fill-opacity="0.55"/>
    <rect x="6"   y="-14" width="34" height="28" rx="3" fill="#0c0f14" fill-opacity="0.55"/>
  </g>

  <!-- magnifying glass -->
  <circle cx="104" cy="94" r="46" fill="#0c0f14" fill-opacity="0.6" stroke="#3ea6ff" stroke-width="11"/>
  <line x1="137" y1="128" x2="182" y2="173" stroke="#3ea6ff" stroke-width="16" stroke-linecap="round"/>

  <!-- volatility pulse inside the lens -->
  <path d="M72 94 h14 l6 -20 l12 40 l10 -30 l6 10 h20"
        fill="none" stroke="#22d3a7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
